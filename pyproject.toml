# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stasima"
dynamic = ["version"]   # single home: stasima/__init__.py __version__ (see [tool.hatch.version])
description = "A server letting multiple AI instances share one durable, version-controlled body of knowledge, with a human practitioner as the gate to shared truth."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Antistrophos" }]
keywords = ["mcp", "knowledge-base", "git", "ai", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
]
# mcp is the substrate; the next three are DIRECT imports of the http transport (cap_server spawns
# uvicorn and builds starlette routes; map_index calls httpx for the local-server embedder). They
# arrive transitively via mcp today, but a direct import deserves a direct declaration — if mcp
# ever slims its dependency tree, the fleet's primary transport must not break silently.
# mcp is pinned <2: the 2.0 SDK (2026-07-28) renames FastMCP to MCPServer and rebuilds the
# low-level server around a new dispatcher — cap_server's session-binding seam (_session_key
# on the streamable-HTTP ServerSession) does not survive it. The v2 port is a deliberate
# migration (stateless protocol, token-carried identity), not a resolver accident.
dependencies = [
    "mcp>=1.10,<2",
    "uvicorn>=0.23",
    "starlette>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
qr = ["qrcode"]   # scannable QR during airlock TOTP provisioning
test = ["anyio>=4"]   # the suite's async harness (7 test files); CI installs .[test]

[project.scripts]
stasima = "stasima.cap_server:main"          # the MCP server (STASIMA_CONFIG points at the toml)
stasima-admin = "stasima.admin:main"         # the practitioner's CLI cockpit
stasima-cockpit = "stasima.tui:main"         # the practitioner's menu cockpit (beta)

[project.urls]
Homepage = "https://github.com/antistrophos/stasima"
Repository = "https://github.com/antistrophos/stasima"
Issues = "https://github.com/antistrophos/stasima/issues"

[tool.hatch.version]
path = "stasima/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["stasima"]

[tool.hatch.build.targets.sdist]
include = ["stasima/", "skills/", "LICENSE", "NOTICE", "BRAND.md", "README.md", "*.md", "stasima.toml.example"]
exclude = ["examples/", "*_test.py", "brand/"]
