# SPDX-License-Identifier: Apache-2.0
# Publish to PyPI via Trusted Publishing (OIDC) — no API token exists anywhere.
# Trigger: publishing a GitHub Release (or the manual button). Chain: test -> build -> publish;
# only the publish job can mint the OIDC credential, and it only ever sees the built artifacts.
# Action pins are the Node 24 majors (GitHub removes Node 20 from runners 2026-09-23); ci.yml runs
# the same test + build on every push, so a pin that breaks shows there first, not at a release.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python run_tests.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stasima
    permissions:
      id-token: write   # the OIDC grant — this is the whole credential story
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1   # a Docker action: not on the Node runtime
