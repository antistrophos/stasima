# SPDX-License-Identifier: Apache-2.0
# The suite on every push and pull request — the check the release workflow runs, run early.
# (Before 0.2.0 the suite ran in CI only at release time; a branch could go unchecked until the tag.)
name: ci

on:
  push:
    branches: ["**"]
  pull_request: {}

jobs:
  test:
    # Ubuntu on the floor Python the package declares; Windows on the Python the reference fleet
    # runs — the stdio hang and the read-only-git-object class of regressions only show on Windows.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python run_tests.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
